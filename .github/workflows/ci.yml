name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: "G0: Python Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Python check deps
        run: |
          python -m pip install -e python/semantic-core
          python -m pip install -e ".[dev,docs]"

      - name: Run repository management checks
        run: python .github/scripts/validate_repo_management.py

      - name: Run changed-file pre-commit checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          mapfile -d '' changed_files < <(
            git diff --name-only --diff-filter=ACMR -z "${base}" "${GITHUB_SHA}"
          )
          if (( ${#changed_files[@]} > 0 )); then
            pre-commit run --files "${changed_files[@]}"
          fi

      - name: Run pyCircuit Python unit tests
        run: pytest tests/unit -m unit

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate packaging helpers
        shell: bash
        run: |
          set -euo pipefail
          python packaging/wheel/get_wheel_plat_name.py --system linux --arch x86_64
          python packaging/wheel/get_wheel_plat_name.py --system macos --arch arm64
          python packaging/wheel/get_wheel_plat_name.py --system macos --arch x86_64
          python -m py_compile \
            packaging/wheel/create_wheel.py \
            packaging/wheel/get_wheel_plat_name.py \
            packaging/wheel/platform_tags.py \
            python/pycircuit/src/pycircuit/packaged_toolchain.py \
            python/pycircuit/src/pycircuit/cli.py \
            flows/tools/summarize_gate_run.py

      - name: Run API hygiene gate
        run: python flows/tools/check_api_hygiene.py python/pycircuit/src/pycircuit examples/pycircuit docs README.md

  agentic-python-checks:
    name: "G0: Agentic Python Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install Agentic Circuit test dependencies
        run: |
          python -m pip install -e python/semantic-core
          python -m pip install -e "python/agentic-circuit[test]"

      - name: Run contracts, frontend, and CLI tests
        shell: bash
        run: |
          set -euo pipefail
          export AC_PYTHON_ONLY=1
          export PYTHONPATH="$PWD/python/semantic-core/src:$PWD/python/agentic-circuit/src:$PWD/tests/python/agentic-circuit"
          python tools/agentic-circuit/check-contracts.py
          python -m unittest discover -s tests/python/agentic-circuit/contracts -p 'test_*.py'
          python -m unittest discover -s tests/python/agentic-circuit/python_frontend -p 'test_*.py'
          python -m unittest discover -s tests/python/agentic-circuit/cli -p 'test_all_commands.py'
          python -m unittest discover -s tests/python/agentic-circuit/cli -p 'test_workspace.py'
