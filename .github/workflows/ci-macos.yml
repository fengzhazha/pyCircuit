name: CI (macOS)

# Optional platform diagnostic. Release builds remain the authoritative macOS
# package and compile validation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"

jobs:
  build-macos:
    name: "Manual: Build Toolchain (macOS)"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install wheel build deps
        run: python -m pip install setuptools wheel

      - name: Install Homebrew packages
        run: |
          brew update
          brew install ninja cmake "llvm@${LLVM_VERSION}" python@3
          echo "$(brew --prefix "llvm@${LLVM_VERSION}")/bin" >> "$GITHUB_PATH"

      - name: Build staged toolchain
        run: |
          bash flows/scripts/pyc build \
            --llvm-config "$(brew --prefix "llvm@${LLVM_VERSION}")/bin/llvm-config" \
            --build-dir "$PWD/.pycircuit_out/toolchain/build" \
            --install-prefix "$PWD/.pycircuit_out/toolchain/install"

      - name: Build platform wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$PWD/dist" \
            "$PWD/python/semantic-core"
          python packaging/wheel/create_wheel.py \
            --install-dir "$PWD/.pycircuit_out/toolchain/install" \
            --out-dir "$PWD/dist"

      - name: Check wheel tag
        shell: bash
        run: |
          set -euxo pipefail
          wheel="$(basename dist/pycircuit_hisi-*.whl)"
          [[ "${wheel}" == pycircuit_hisi-*-py3-none-*.whl ]]

      - name: Run example compile gate
        run: |
          export PYC_TOOLCHAIN_ROOT="$PWD/.pycircuit_out/toolchain/install"
          export PATH="$PYC_TOOLCHAIN_ROOT/bin:$PATH"
          export PYC_SKIP_SEMANTIC_REGRESSIONS=1
          unset PYCC
          bash flows/scripts/run_examples.sh

      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m venv .venv-wheel
          source .venv-wheel/bin/activate
          pip install dist/*.whl
          export PYC_TOOLCHAIN_ROOT="$(python -c 'import pycircuit, pathlib; print((pathlib.Path(pycircuit.__file__).resolve().parent / "_toolchain").as_posix())')"
          export PYC_USE_INSTALLED_PYTHON_PACKAGE=1
          export PYC_SKIP_SEMANTIC_REGRESSIONS=1
          unset PYCC
          bash flows/scripts/run_examples.sh

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyc-wheel-macos
          path: dist/*.whl
          retention-days: 1
