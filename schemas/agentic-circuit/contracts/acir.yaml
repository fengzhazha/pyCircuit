  - ac.trace.decode
  - ac.trace.eof
  - ac.trace.position
  - ac.require
  - ac.ensure
  - ac.assert
  - ac.probe
  - ac.stat
  - ac.stat.add
  - ac.instrumentation
types:
  - struct
  - packet
  - transaction
  - enum
  - value_array
  - var
  - queue
  - array
  - flow
  - endpoint
  - resource_ref
  - channel
  - event
  - resource_token
