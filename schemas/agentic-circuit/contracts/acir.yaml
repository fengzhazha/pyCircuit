# Normative ACIR public inventory.
#
# This manifest is the contract-side source of truth for the public ACIR
# surface. scripts/check-ir-coverage.py requires the ODS definitions to
# match these lists exactly: any added, renamed, or removed public operation
# or type must be reflected here in the same commit, and every entry must
# have observable lit coverage.
schema: acir-ir-inventory
contract_epoch: "0.5"
dialect: acir
operations:
  - ac.system
  - ac.type_scope
  - ac.type_alias
  - ac.module
  - ac.module.extern
  - ac.instance
  - ac.array
  - ac.instances
  - ac.view
  - ac.port
  - ac.return
  - ac.queue
  - ac.event_queue
  - ac.resource
  - ac.address_space
  - ac.address_map
  - ac.time_domain
  - ac.struct
  - ac.bitfield
  - ac.enum
  - ac.packet
  - ac.transaction
  - ac.interface
  - ac.protocol
  - ac.role
  - ac.state
  - ac.event
  - ac.transition
  - ac.guarantee
  - ac.process
  - ac.var.constant
  - ac.var.enum
  - ac.var.tuple
  - ac.var.array
  - ac.var.element
  - ac.var.add
  - ac.var.sub
  - ac.var.mul
  - ac.var.and
  - ac.var.or
  - ac.var.xor
  - ac.var.not
  - ac.var.shl
  - ac.var.shr
  - ac.var.matches
  - ac.var.cmp
  - ac.var.get
  - ac.var.with
  - ac.var.popcount
  - ac.var.count_zeros
  - ac.var.priority_encode
  - ac.var.select
  - ac.var.extract
  - ac.var.concat
  - ac.var.insert
  - ac.var.decl
  - ac.var.read
  - ac.var.read_element
  - ac.var.assign
  - ac.var.assign_element
  - ac.var.match
  - ac.var.match.yield
  - ac.var.choose
  - ac.var.choose.yield
  - ac.transform
  - ac.transform.yield
  - ac.rule
  - ac.rule.condition
  - ac.rule.output
  - ac.rule.return
  - ac.state.snapshot
  - ac.state.snapshot_set
  - ac.marker.type
  - ac.marker.value
  - ac.marker.obligation
  - ac.source
  - ac.sink
  - ac.observe
  - ac.expect
  - ac.expect.yield
  - ac.broadcast
  - ac.fork
  - ac.route
  - ac.route.yield
  - ac.select
  - ac.select.yield
  - ac.merge
  - ac.barrier
  - ac.credit
  - ac.credit.yield
  - ac.dependency
  - ac.dependency.yield
  - ac.memory.instance
  - ac.memory.request
  - ac.memory.yield
  - ac.table
  - ac.table.get
  - ac.table.propose
  - ac.table.match
  - ac.table.match.yield
  - ac.table.choose
  - ac.table.choose.yield
  - ac.table.read
  - ac.table.write
  - ac.table.masked_write
  - ac.table.yield
  - ac.slot
  - ac.slot.get
  - ac.slot.release
  - ac.slot.yield
  - ac.reorder
  - ac.reorder.yield
  - ac.feedback
  - ac.feedback.yield
  - ac.scope
  - ac.scope.yield
  - ac.firing
  - ac.firing.condition
  - ac.firing.output
  - ac.firing.yield
  - ac.try_send
  - ac.try_recv
  - ac.schedule
  - ac.wait_until
