[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycircuit-hisi"
version = "6.0.0"
description = "A Python-based hardware description framework that compiles Python to RTL through MLIR"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "PTO-ISA Contributors" }
]
requires-python = ">=3.10"
keywords = ["hardware", "rtl", "verilog", "mlir", "hdl", "fpga", "asic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Electronic Design Automation (EDA)",
]
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "pycircuit-semantic-core==6.0.0",
]

[project.urls]
Homepage = "https://github.com/PTO-ISA/pyCircuit"
Repository = "https://github.com/PTO-ISA/pyCircuit"
Issues = "https://github.com/PTO-ISA/pyCircuit/issues"
Releases = "https://github.com/PTO-ISA/pyCircuit/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mdx-gh-links>=0.2.0",
]

[project.scripts]
pycircuit = "pycircuit.cli:main"

[tool.setuptools.packages.find]
where = ["python/pycircuit/src"]

[tool.setuptools.package-data]
pycircuit = ["**/*.py", "**/*.md"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"python/pycircuit/src/pycircuit/__init__.py" = ["A004"]
"python/pycircuit/src/pycircuit/cli.py" = ["A004", "T201"]
"python/pycircuit/src/pycircuit/design.py" = ["UP038"]
"python/pycircuit/src/pycircuit/dsl.py" = ["UP038"]
"python/pycircuit/src/pycircuit/hw.py" = ["A002", "B905", "C401", "C416", "E731", "I001", "UP007", "UP035", "UP037", "UP038"]
"python/pycircuit/src/pycircuit/hierarchical.py" = ["E721", "F841"]
"python/pycircuit/src/pycircuit/jit.py" = ["A001", "B009", "B905", "I001", "N818", "UP035", "UP037", "UP038"]
"python/pycircuit/src/pycircuit/lib/*.py" = ["N802"]
"python/pycircuit/src/pycircuit/logic/__init__.py" = ["B905"]
"python/pycircuit/src/pycircuit/literals.py" = ["N802"]
"python/pycircuit/src/pycircuit/path_shortening.py" = ["B008"]
"python/pycircuit/src/pycircuit/probe.py" = ["C401", "UP038"]
"python/pycircuit/src/pycircuit/sidecar_sections.py" = ["B905"]
"python/pycircuit/src/pycircuit/spec/builders.py" = ["N807", "UP038"]
"python/pycircuit/src/pycircuit/spec/dse.py" = ["A001", "B905", "UP038"]
"python/pycircuit/src/pycircuit/spec/types.py" = ["C416", "E741", "UP038"]
"python/pycircuit/src/pycircuit/tb.py" = ["N801", "UP038"]
"python/pycircuit/src/pycircuit/testbench.py" = ["B905"]
"python/pycircuit/src/pycircuit/v6.py" = ["A002", "B010", "I001", "N801", "N816", "UP007", "UP037", "UP038"]
"python/pycircuit/src/pycircuit/wiring/connect.py" = ["C416", "UP038"]
"designs/blocks/BypassUnit/*.py" = ["A004", "T201"]
"designs/blocks/IssueQueue/*.py" = ["N999", "T201"]
"examples/pycircuit/**/*.py" = ["F401", "F841", "N803", "N806", "N999", "T201"]
"flows/tools/*.py" = ["T201"]
"flows/tools/pyc_module_graph.py" = ["C408"]
"flows/tools/schematic_view.py" = ["B007"]
"packaging/wheel/get_wheel_plat_name.py" = ["T201"]
"tests/test_lane_slice.py" = ["F841"]
"tests/test_pyc_enum.py" = ["B018", "N803", "N806"]
"tools/*.py" = ["T201"]
"examples/pycircuit/digital_filter/digital_filter.py" = ["N803", "N806"]
"examples/pycircuit/fm16/npu_node.py" = ["N803", "N806"]
"examples/pycircuit/fm16/sw5809s.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "python/semantic-core/src",
    "python/pycircuit/src",
    "python/agentic-circuit/src",
    ".",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: fast Python-only tests",
    "system: end-to-end smoke tests that require pycc and simulation tools",
]
