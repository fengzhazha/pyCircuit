[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycircuit-semantic-core"
version = "6.0.0"
description = "Shared immutable semantic descriptors for pyCircuit frontends"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "PTO-ISA Contributors" }]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
